<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Prueba API Client - AlertaCalle</title>
</head>
<body>
  <h1>Prueba de conexión con la API</h1>

  <button id="btnListar">Listar alertas</button>
  <pre id="resultado">Los resultados van a aparecer acá...</pre>

  <!-- Importa el JS compilado, NO el .ts -->
  <script type="module">
    import { ApiClient } from "./js/client.js";

    const resultado = document.getElementById("resultado");

    document.getElementById("btnListar").addEventListener("click", async () => {
      resultado.textContent = "Cargando...";
      try {
        const alertas = await ApiClient.obtenerAlertas();
        resultado.textContent = JSON.stringify(alertas, null, 2);
      } catch (err) {
        resultado.textContent = "Error: " + err.message;
      }
    });
  </script>
</body>
</html>
